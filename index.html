<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบสแกนคิวอาร์โค้ดสินค้า</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Html5-qrcode CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
    <!-- Google Font (Prompt) -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Prompt', sans-serif;
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col items-center justify-center p-4">

    <div class="w-full max-w-md bg-white rounded-2xl shadow-xl overflow-hidden p-6">
        <!-- ส่วนหัวข้อ -->
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-slate-800">📦 สแกนรหัสสินค้า</h1>
            <p class="text-sm text-slate-500 mt-1">สแกน QR Code เพื่อดึงตัวเลขสินค้า</p>
        </div>

        <!-- กรอบสำหรับแสดงกล้องสแกน -->
        <div class="relative w-full bg-slate-900 rounded-xl overflow-hidden shadow-inner mb-6 flex items-center justify-center min-h-[250px]">
            <div id="reader" class="w-full"></div>
            <!-- ข้อความแนะนำตอนยังไม่เปิดกล้อง -->
            <div id="placeholder" class="absolute text-slate-400 text-sm pointer-events-none text-center p-4">
                กดปุ่ม "เริ่มสแกน" ด้านล่างเพื่อเปิดกล้อง
            </div>
        </div>

        <!-- ปุ่มควบคุม -->
        <div class="flex gap-3 mb-6">
            <button id="start-btn" onclick="startScanner()" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-3 px-4 rounded-xl shadow-lg shadow-emerald-600/20 transition-all duration-200 flex items-center justify-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" />
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z" />
                </svg>
                เริ่มสแกน
            </button>
            <button id="stop-btn" onclick="stopScanner()" disabled class="flex-1 bg-rose-500 hover:bg-rose-600 disabled:bg-slate-300 disabled:cursor-not-allowed text-white font-medium py-3 px-4 rounded-xl shadow-lg transition-all duration-200 flex items-center justify-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
                หยุดกล้อง
            </button>
        </div>

        <!-- ส่วนแสดงผลลัพธ์ตัวเลขสินค้า -->
        <div class="bg-slate-50 border border-slate-200 rounded-xl p-4 text-center">
            <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider block mb-1">รหัสสินค้าที่สแกนได้</span>
            <div id="result" class="text-3xl font-bold text-slate-700 tracking-wide">
                - - - - - -
            </div>
        </div>
    </div>

    <!-- Script สำหรับจัดการการสแกน -->
    <script>
        let html5QrCode = null;

        function startScanner() {
            const placeholder = document.getElementById('placeholder');
            placeholder.style.display = 'none';

            if (!html5QrCode) {
                html5QrCode = new Html5Qrcode("reader");
            }

            // เลือกกล้องหลัง (environment) เป็นหลักสำหรับมือถือ
            html5QrCode.start(
                { facingMode: "environment" },
                {
                    fps: 10,    // ความเร็วในการเฟรมสแกน
                    qrbox: { width: 220, height: 220 } // กรอบสแกน
                },
                (decodedText, decodedResult) => {
                    // ทำความสะอาดหรือดึงเฉพาะตัวเลข (ถ้าต้องการกรองเฉพาะตัวเลข)
                    // ตัวอย่างนี้แสดงผลข้อความที่อ่านได้ทันที
                    document.getElementById('result').innerText = decodedText;
                    document.getElementById('result').classList.remove('text-slate-700');
                    document.getElementById('result').classList.add('text-emerald-600');

                    // (ทางเลือก) สั่นเตือนเมื่อสแกนสำเร็จ (ถ้ามือถือรองรับ)
                    if (navigator.vibrate) {
                        navigator.vibrate(200);
                    }

                    // หยุดกล้องอัตโนมัติหลังสแกนได้ (ถ้าต้องการให้สแกนต่อเนื่อง เอาบรรทัดนี้ออกได้ครับ)
                    // stopScanner();
                },
                (errorMessage) => {
                    // ข้อผิดพลาดระหว่างหากรอบ QR (ปล่อยว่างไว้ไม่ต้องแสดงผล เพื่อไม่ให้รกคอนโซล)
                }
            ).then(() => {
                document.getElementById('start-btn').disabled = true;
                document.getElementById('stop-btn').disabled = false;
            }).catch((err) => {
                console.error("ไม่สามารถเปิดกล้องได้: ", err);
                alert("ไม่สามารถเปิดกล้องได้ กรุณาตรวจสอบการอนุญาตใช้งานกล้อง (Camera Permission)");
                placeholder.style.display = 'block';
            });
        }

        function stopScanner() {
            if (html5QrCode) {
                html5QrCode.stop().then(() => {
                    document.getElementById('start-btn').disabled = false;
                    document.getElementById('stop-btn').disabled = true;
                    document.getElementById('placeholder').style.display = 'block';
                }).catch((err) => {
                    console.error("ไม่สามารถปิดกล้องได้: ", err);
                });
            }
        }
    </script>
</body>
</html>
